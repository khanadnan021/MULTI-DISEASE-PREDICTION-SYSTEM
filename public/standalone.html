<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HealthPredict AI - Multi-Disease Prediction System</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen flex flex-col">
  <!-- Top Professional Header -->
  <header class="bg-slate-900 text-white border-b border-slate-800 px-6 py-4 shadow-sm">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="w-8 h-8 bg-blue-600 rounded flex items-center justify-center font-bold text-lg text-white shadow-xs">
          H
        </div>
        <div>
          <span class="font-semibold text-lg tracking-tight text-white">
            HealthPredict <span class="text-blue-400">AI</span>
          </span>
          <span class="text-xs text-slate-400 font-mono ml-2 hidden sm:inline">
            Standalone Client
          </span>
        </div>
      </div>
      <div class="flex items-center space-x-4">
        <span class="px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-800 text-emerald-400 border border-slate-700 flex items-center">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse mr-2"></span>
          75/25 Split Active
        </span>
        <div class="text-right hidden sm:block">
          <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Operator</p>
          <p class="text-xs font-semibold text-slate-200">Dr. Khan Adnan</p>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8 flex-1 space-y-6">
    <!-- Disease Selection Tabs -->
    <div class="flex space-x-2 border-b border-slate-200 pb-3 overflow-x-auto">
      <button onclick="selectDisease('heart')" id="tab-heart" class="px-4 py-2 font-medium text-sm rounded-lg bg-blue-600 text-white shadow-xs cursor-pointer">
        Heart Disease
      </button>
      <button onclick="selectDisease('diabetes')" id="tab-diabetes" class="px-4 py-2 font-medium text-sm rounded-lg text-slate-600 hover:bg-slate-200 cursor-pointer">
        Diabetes
      </button>
      <button onclick="selectDisease('kidney')" id="tab-kidney" class="px-4 py-2 font-medium text-sm rounded-lg text-slate-600 hover:bg-slate-200 cursor-pointer">
        Chronic Kidney
      </button>
      <button onclick="selectDisease('liver')" id="tab-liver" class="px-4 py-2 font-medium text-sm rounded-lg text-slate-600 hover:bg-slate-200 cursor-pointer">
        Liver Disease
      </button>
    </div>

    <!-- Prediction Form Container -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm flex flex-col">
      <div class="p-6 border-b border-slate-100 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div>
          <h2 id="form-title" class="text-lg font-semibold text-slate-800">Heart Disease Risk Evaluation</h2>
          <p class="text-xs text-slate-500 mt-0.5">Scikit-Learn Random Forest Classifier (75% Train / 25% Test)</p>
        </div>
        <div class="flex items-center space-x-2">
          <span class="text-xs text-slate-400 font-bold uppercase tracking-wider mr-1">Presets:</span>
          <button onclick="loadSample('healthy')" class="text-xs px-3 py-1.5 rounded-lg border border-blue-200 bg-blue-50 text-blue-700 font-semibold hover:bg-blue-100 cursor-pointer">
            Healthy Sample
          </button>
          <button onclick="loadSample('at_risk')" class="text-xs px-3 py-1.5 rounded-lg border border-rose-200 bg-rose-50 text-rose-700 font-semibold hover:bg-rose-100 cursor-pointer">
            At-Risk Sample
          </button>
        </div>
      </div>

      <form id="disease-form" onsubmit="submitPrediction(event)" class="flex-1 flex flex-col">
        <div id="fields-container" class="p-6 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-y-6 gap-x-8">
          <!-- Populated dynamically -->
        </div>

        <div class="p-6 bg-slate-50 border-t border-slate-100 rounded-b-xl flex flex-col sm:flex-row items-center justify-between gap-4">
          <button type="submit" id="submit-btn" class="w-full sm:w-auto px-6 py-2.5 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-semibold text-sm rounded-lg shadow-sm transition-all cursor-pointer">
            Generate Analysis
          </button>

          <div class="flex items-center space-x-6 text-right">
            <div>
              <p class="text-xs text-slate-400 font-bold uppercase">Pipeline</p>
              <p class="text-sm font-semibold text-slate-700">StandardScaler + RF</p>
            </div>
          </div>
        </div>
      </form>
    </div>

    <!-- Result Banner -->
    <div id="result-box" class="hidden bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden transition-all">
      <div id="result-header" class="p-6 border-b transition-colors">
        <div class="flex items-center space-x-2 text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">
          <span>Evaluation Verdict</span>
          <span id="result-risk-level" class="px-2 py-0.5 rounded text-xs font-bold"></span>
        </div>
        <h3 id="result-title" class="text-2xl font-bold text-slate-900 tracking-tight"></h3>
        <p id="result-summary" class="text-sm text-slate-600 mt-1 max-w-2xl leading-relaxed"></p>
      </div>

      <div class="p-6 space-y-6">
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
            <span class="text-xs text-slate-500 font-bold uppercase">Risk Score</span>
            <div id="result-risk-score" class="text-2xl font-bold font-mono text-slate-800 mt-1"></div>
          </div>
          <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
            <span class="text-xs text-slate-500 font-bold uppercase">Confidence</span>
            <div id="result-confidence" class="text-2xl font-bold font-mono text-slate-800 mt-1"></div>
          </div>
          <div class="p-4 bg-slate-50 rounded-lg border border-slate-200">
            <span class="text-xs text-slate-500 font-bold uppercase">Classification</span>
            <div id="result-class" class="text-base font-bold mt-1 text-slate-800"></div>
          </div>
        </div>

        <div>
          <h4 class="text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Key Factor Explanations:</h4>
          <ul id="result-factors" class="space-y-2 text-xs text-slate-700"></ul>
        </div>
      </div>
    </div>
  </main>

  <script>
    let currentDisease = 'heart';
    let sampleData = null;

    fetch('/api/sample-data')
      .then(r => r.json())
      .then(d => { if (d.status === 'success') sampleData = d.samples; })
      .catch(() => console.log('Loaded offline'));

    const DISEASE_FORMS = {
      heart: [
        { name: 'age', label: 'Age (Years)', val: 55 },
        { name: 'sex', label: 'Sex (1=M, 0=F)', val: 1 },
        { name: 'cp', label: 'Chest Pain Type (0-3)', val: 1 },
        { name: 'trestbps', label: 'Resting Blood Pressure', val: 130, unit: 'mmHg' },
        { name: 'chol', label: 'Serum Cholesterol', val: 240, unit: 'mg/dl' },
        { name: 'fbs', label: 'Fasting Blood Sugar > 120 (1/0)', val: 0 },
        { name: 'restecg', label: 'Resting ECG (0-2)', val: 0 },
        { name: 'thalach', label: 'Max Heart Rate', val: 155, unit: 'bpm' },
        { name: 'exang', label: 'Exercise Induced Angina (1/0)', val: 0 },
        { name: 'oldpeak', label: 'ST Depression', val: 1.2, step: '0.1' },
        { name: 'slope', label: 'Slope of Peak Exercise ST (0-2)', val: 1 },
        { name: 'ca', label: 'Major Fluoroscopy Vessels (0-3)', val: 0 },
        { name: 'thal', label: 'Thallium Stress Result (0-2)', val: 1 }
      ],
      diabetes: [
        { name: 'Pregnancies', label: 'Number of Pregnancies', val: 2 },
        { name: 'Glucose', label: 'Plasma Glucose', val: 120, unit: 'mg/dL' },
        { name: 'BloodPressure', label: 'Diastolic Blood Pressure', val: 74, unit: 'mmHg' },
        { name: 'SkinThickness', label: 'Triceps Skinfold', val: 26, unit: 'mm' },
        { name: 'Insulin', label: '2-Hour Serum Insulin', val: 95, unit: 'mu U/ml' },
        { name: 'BMI', label: 'Body Mass Index', val: 26.8, step: '0.1', unit: 'kg/m²' },
        { name: 'DiabetesPedigreeFunction', label: 'Diabetes Pedigree Function', val: 0.45, step: '0.01' },
        { name: 'Age', label: 'Age (Years)', val: 38 }
      ],
      kidney: [
        { name: 'age', label: 'Age (Years)', val: 50 },
        { name: 'bp', label: 'Blood Pressure', val: 80, unit: 'mmHg' },
        { name: 'sg', label: 'Specific Gravity', val: 1.020, step: '0.005' },
        { name: 'al', label: 'Albumin (0-4)', val: 0 },
        { name: 'su', label: 'Sugar (0-3)', val: 0 },
        { name: 'bgr', label: 'Blood Glucose Random', val: 110, unit: 'mg/dL' },
        { name: 'bu', label: 'Blood Urea', val: 32, unit: 'mg/dL' },
        { name: 'sc', label: 'Serum Creatinine', val: 1.0, step: '0.1', unit: 'mg/dL' },
        { name: 'sod', label: 'Sodium', val: 138, unit: 'mEq/L' },
        { name: 'pot', label: 'Potassium', val: 4.4, step: '0.1', unit: 'mEq/L' },
        { name: 'hemo', label: 'Hemoglobin', val: 14.2, step: '0.1', unit: 'g/dL' },
        { name: 'pcv', label: 'Packed Cell Volume', val: 44 },
        { name: 'wc', label: 'White Blood Cell Count', val: 7800, unit: 'cells/cumm' },
        { name: 'rc', label: 'Red Blood Cell Count', val: 4.8, step: '0.1', unit: 'millions/cmm' },
        { name: 'htn', label: 'Hypertension (1=Yes, 0=No)', val: 0 }
      ],
      liver: [
        { name: 'Age', label: 'Age (Years)', val: 42 },
        { name: 'Gender', label: 'Gender (1=Male, 0=Female)', val: 1 },
        { name: 'Total_Bilirubin', label: 'Total Bilirubin', val: 1.0, step: '0.1', unit: 'mg/dL' },
        { name: 'Direct_Bilirubin', label: 'Direct Bilirubin', val: 0.3, step: '0.1', unit: 'mg/dL' },
        { name: 'Alkaline_Phosphotase', label: 'Alkaline Phosphatase', val: 195, unit: 'IU/L' },
        { name: 'Alamine_Aminotransferase', label: 'SGPT / ALT', val: 30, unit: 'IU/L' },
        { name: 'Aspartate_Aminotransferase', label: 'SGOT / AST', val: 32, unit: 'IU/L' },
        { name: 'Total_Proteins', label: 'Total Proteins', val: 7.0, step: '0.1', unit: 'g/dL' },
        { name: 'Albumin', label: 'Albumin', val: 4.0, step: '0.1', unit: 'g/dL' },
        { name: 'Albumin_and_Globulin_Ratio', label: 'Albumin/Globulin Ratio', val: 1.1, step: '0.05' }
      ]
    };

    function renderFields() {
      const container = document.getElementById('fields-container');
      container.innerHTML = '';
      const fields = DISEASE_FORMS[currentDisease];
      fields.forEach(f => {
        const div = document.createElement('div');
        div.innerHTML = `
          <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">${f.label}</label>
          <div class="relative">
            <input type="number" id="inp-${f.name}" name="${f.name}" value="${f.val}" step="${f.step || '1'}" required
                   class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-lg text-slate-800 text-sm font-medium focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500">
            ${f.unit ? `<span class="absolute right-3.5 top-2.5 text-slate-400 text-xs font-medium">${f.unit}</span>` : ''}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function selectDisease(d) {
      currentDisease = d;
      ['heart', 'diabetes', 'kidney', 'liver'].forEach(k => {
        const btn = document.getElementById('tab-' + k);
        if (k === d) {
          btn.className = 'px-4 py-2 font-medium text-sm rounded-lg bg-blue-600 text-white shadow-xs cursor-pointer';
        } else {
          btn.className = 'px-4 py-2 font-medium text-sm rounded-lg text-slate-600 hover:bg-slate-200 cursor-pointer';
        }
      });
      document.getElementById('form-title').innerText = d.charAt(0).toUpperCase() + d.slice(1) + ' Disease Risk Evaluation';
      document.getElementById('result-box').classList.add('hidden');
      renderFields();
    }

    function loadSample(type) {
      if (!sampleData || !sampleData[currentDisease]) return;
      const targetSample = type === 'healthy' ? sampleData[currentDisease][0] : sampleData[currentDisease][1];
      if (!targetSample) return;
      for (const [key, val] of Object.entries(targetSample.parameters)) {
        const input = document.getElementById('inp-' + key);
        if (input) input.value = val;
      }
    }

    async function submitPrediction(e) {
      e.preventDefault();
      const submitBtn = document.getElementById('submit-btn');
      submitBtn.disabled = true;
      submitBtn.innerText = 'Executing Model Pipeline...';

      const data = {};
      const fields = DISEASE_FORMS[currentDisease];
      fields.forEach(f => {
        data[f.name] = parseFloat(document.getElementById('inp-' + f.name).value);
      });

      try {
        const response = await fetch('/predict/' + currentDisease, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const result = await response.json();
        displayResult(result);
      } catch (err) {
        alert('Prediction error: ' + err.message);
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerText = 'Generate Analysis';
      }
    }

    function displayResult(res) {
      const box = document.getElementById('result-box');
      box.classList.remove('hidden');

      const isHigh = res.risk_level === 'High Risk';
      const header = document.getElementById('result-header');
      header.className = isHigh
        ? 'p-6 border-b bg-rose-50 border-rose-200 text-rose-900'
        : 'p-6 border-b bg-blue-50 border-blue-200 text-blue-900';

      document.getElementById('result-risk-level').innerText = res.risk_level;
      document.getElementById('result-risk-level').className = isHigh
        ? 'px-2 py-0.5 rounded font-bold bg-rose-200 text-rose-800'
        : 'px-2 py-0.5 rounded font-bold bg-blue-200 text-blue-800';

      document.getElementById('result-title').innerText = res.result;
      document.getElementById('result-summary').innerText = res.clinical_summary;
      document.getElementById('result-risk-score').innerText = res.risk_score + '%';
      document.getElementById('result-confidence').innerText = res.confidence + '%';
      document.getElementById('result-class').innerText = res.is_positive ? 'Disease Detected (Class 1)' : 'Healthy Baseline (Class 0)';

      const factors = document.getElementById('result-factors');
      factors.innerHTML = '';
      res.key_factors.forEach(f => {
        const li = document.createElement('li');
        li.className = 'p-3 bg-slate-50 rounded-lg border border-slate-200 flex items-center';
        li.innerHTML = `<span class="w-2 h-2 rounded-full mr-2 ${isHigh ? 'bg-rose-500' : 'bg-blue-500'}"></span><span>${f}</span>`;
        factors.appendChild(li);
      });
      box.scrollIntoView({ behavior: 'smooth' });
    }

    renderFields();
  </script>
</body>
</html>
